[project]
name = "amsterdam-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "tqdm>=4.70.1",
]

[project.scripts]
amsterdam-pipeline = "amsterdam_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
